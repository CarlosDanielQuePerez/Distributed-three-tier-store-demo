global
    log stdout format raw local0
    maxconn 2000

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# Escritura: un solo nodo activo (galera1); galera2 y galera3 son respaldo
frontend db_write_in
    bind *:3306
    default_backend galera_write

# Lectura: reparte entre los 3 nodos
frontend db_read_in
    bind *:3307
    default_backend galera_read

backend galera_write
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check backup
    server galera3 galera3:3306 check backup

backend galera_read
    balance roundrobin
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check
    server galera3 galera3:3306 check

# Estadísticas (solo dentro de la red de base de datos)
listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
