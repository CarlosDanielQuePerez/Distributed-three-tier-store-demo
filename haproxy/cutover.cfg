# Corte gradual (Fase 8): reparte el tráfico entre la pila de Compose y el Ingress de K3s.
# Los pesos vienen del entorno (CUTOVER_COMPOSE_WEIGHT / CUTOVER_K3S_WEIGHT). Para mover
# más tráfico a K3s se cambian en .env y se recrea el contenedor, o en caliente con:
#   echo "set weight store/k3s 50" | socat stdio tcp:127.0.0.1:9999   (Runtime API)
# Es el equivalente local de los pesos DNS del plan.
global
    log stdout format raw local0
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    retries 2
    option redispatch

frontend cutover_in
    bind *:80
    http-response set-header X-Cutover-Backend %s
    default_backend store

backend store
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    # Compose: entrada de presentación existente (VIP de Keepalived detrás).
    server compose presentation-entry:80 weight "${CUTOVER_COMPOSE_WEIGHT}" check
    # K3s: IP de MetalLB/Traefik. El Host se fija al del Ingress; Nginx de Compose
    # acepta cualquier Host (server_name _), así que sirve para ambos.
    http-request set-header Host "${K3S_INGRESS_HOST}"
    server k3s "${K3S_INGRESS_ADDR}" weight "${CUTOVER_K3S_WEIGHT}" check

listen stats
    bind *:8405
    stats enable
    stats uri /
    stats refresh 5s
