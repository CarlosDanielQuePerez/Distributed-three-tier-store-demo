global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout check 1s
    retries 2
    option redispatch 1
    timeout client 30s
    timeout server 30s

frontend presentation
    bind *:80
    http-request set-header X-Presentation-LB presentation-lb-master
    default_backend websites

backend websites
    balance roundrobin
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    option httpchk GET /
    server web1 web1:80 check
    server web2 web2:80 check
    server web3 web3:80 check
