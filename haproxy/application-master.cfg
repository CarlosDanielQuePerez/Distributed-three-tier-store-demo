global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout check 1s
    retries 2
    option redispatch 1
    timeout client 30s
    timeout server 30s

frontend application
    bind *:8080
    http-request set-header X-Application-LB application-lb-master
    default_backend application_nodes

backend application_nodes
    balance roundrobin
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    option httpchk GET /health
    server app1 app1:8080 check
    server app2 app2:8080 check
    server app3 app3:8080 check
