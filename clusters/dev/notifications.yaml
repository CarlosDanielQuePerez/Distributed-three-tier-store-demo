# Fase 5, "notifications": estado de cada reconciliación como commit status en GitHub
# y eventos de error a Slack. Los Secrets github-token y slack-webhook (clave address)
# se crean en flux-system (ver docs/IMPLEMENTACION.md).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata: { name: github-status, namespace: flux-system }
spec:
  type: github
  address: https://github.com/CarlosDanielQuePerez/Distributed-three-tier-store-demo
  secretRef: { name: github-token }
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata: { name: github-status, namespace: flux-system }
spec:
  providerRef: { name: github-status }
  eventSources:
    - { kind: Kustomization, name: apps }
    - { kind: Kustomization, name: data }
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata: { name: slack, namespace: flux-system }
spec:
  type: slack
  channel: store-dev
  secretRef: { name: slack-webhook }
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata: { name: errors-to-slack, namespace: flux-system }
spec:
  providerRef: { name: slack }
  eventSeverity: error
  eventSources:
    - { kind: Kustomization, name: "*" }
    - { kind: HelmRelease, name: "*" }
    - { kind: GitRepository, name: "*" }
