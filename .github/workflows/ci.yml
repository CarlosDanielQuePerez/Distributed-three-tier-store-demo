# Fase 4 — CI en cada PR (y en push a main): lint, pruebas, imágenes + Trivy,
# Terraform (fmt/validate/tflint/checkov) y validación de manifiestos (kubeconform).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
      - run: npm ci --omit=dev
        working-directory: application
      - run: npm ci --omit=dev
        working-directory: worker
      - run: npm run lint
      - run: npm test

  images:
    name: Imagen ${{ matrix.image }} + Trivy
    runs-on: ubuntu-latest
    needs: node
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: store-api, dockerfile: application/Dockerfile }
          - { image: store-worker, dockerfile: worker/Dockerfile }
          - { image: store-web, dockerfile: web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Trivy (vulnerabilidades HIGH/CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  compose:
    name: Docker Compose (config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet && docker compose --profile observability --profile cutover config --quiet

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate
        run: |
          for env in dev prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl" && tflint --recursive --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"
        working-directory: infra/terraform
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          # Informativo: el laboratorio usa SSH a nodos propios, no recursos de nube.
          soft_fail: true

  manifests:
    name: Manifiestos (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kustomize y kubeconform
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - name: Validar
        run: scripts/validate-manifests.sh
