# Fase 7 — cadena de suministro: actualizaciones automáticas de dependencias.
# Solo versiones menores y parches (seguridad), agrupadas para no saturar de PRs.
# Los saltos de versión mayor (p. ej. Node 22 → 25, amqplib 0.x → 2.x) cambian APIs y se
# hacen a mano, con pruebas: Dependabot no los propone. Los providers de Terraform se
# actualizan a mano con "terraform init -upgrade" (versiones fijadas en .terraform.lock.hcl).
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/application", "/worker"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories: ["/application", "/worker", "/web"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # Node: solo la línea LTS 22; nginx: solo parches de la rama estable 1.30.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
