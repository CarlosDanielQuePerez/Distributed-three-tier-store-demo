apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-worker
  labels: { app.kubernetes.io/name: store-worker, store.tier: application }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: store-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: store-worker, store.tier: application }
    spec:
      serviceAccountName: store-worker
      automountServiceAccountToken: false
      # Al terminar, el worker cierra RabbitMQ y los mensajes sin ack vuelven a la cola.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: store-worker } }
      containers:
        - name: worker
          image: store-worker
          imagePullPolicy: IfNotPresent
          ports: [{ name: probes, containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: store-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: WORKER_NODE
              value: $(POD_NAME)
            - name: DB_POOL_SIZE
              value: "4"
            - name: OTEL_SERVICE_NAME
              value: store-worker
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=$(DEPLOYMENT_ENVIRONMENT),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.namespace.name=store
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-app-secrets, key: DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: store-app-secrets, key: REDIS_PASSWORD } }
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: store-app-secrets, key: RABBITMQ_URL } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: store-app-secrets, key: MONGO_PASSWORD } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
