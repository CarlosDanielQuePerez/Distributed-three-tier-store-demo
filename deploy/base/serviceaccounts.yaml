# Ningún workload de la tienda habla con la API de Kubernetes: sin token montado (RBAC mínimo).
apiVersion: v1
kind: ServiceAccount
metadata: { name: store-web }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: store-api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: store-worker }
automountServiceAccountToken: false
