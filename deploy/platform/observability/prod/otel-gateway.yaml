apiVersion: v1
kind: ConfigMap
metadata: { name: otel-gateway-config }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      # Métricas nativas de RabbitMQ (plugin rabbitmq_prometheus).
      prometheus:
        config:
          scrape_configs:
            - job_name: rabbitmq
              scrape_interval: 30s
              static_configs:
                - targets: [store-rabbitmq.store-data.svc.cluster.local:15692]
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25 }
      batch: { timeout: 5s, send_batch_size: 8192 }
    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls: { insecure: true }
      otlphttp/mimir:
        endpoint: http://mimir-gateway.observability.svc.cluster.local/otlp
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    service:
      extensions: [health_check]
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo] }
        metrics: { receivers: [otlp, prometheus], processors: [memory_limiter, batch], exporters: [otlphttp/mimir] }
        logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  labels: { app.kubernetes.io/name: otel-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: otel-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-gateway }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.140.0
          args: ["--config=/conf/config.yaml"]
          env:
            - { name: GOMEMLIMIT, value: 400MiB }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe: { httpGet: { path: /, port: 13133 } }
          livenessProbe: { httpGet: { path: /, port: 13133 } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: config, mountPath: /conf }]
      volumes:
        - name: config
          configMap: { name: otel-gateway-config }
---
apiVersion: v1
kind: Service
metadata: { name: otel-gateway }
spec:
  selector: { app.kubernetes.io/name: otel-gateway }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
