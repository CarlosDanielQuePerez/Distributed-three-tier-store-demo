# Alertmanager de Mimir: envía a Slack. El webhook se inyecta desde el Secret
# observability/alertmanager-slack (clave url) al cargar la configuración.
route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: slack
    slack_configs:
      - api_url: SLACK_WEBHOOK_URL
        channel: "#store-alerts"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
