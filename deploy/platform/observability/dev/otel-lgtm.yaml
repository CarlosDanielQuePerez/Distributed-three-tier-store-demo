apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  labels: { app.kubernetes.io/name: otel-lgtm }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: otel-lgtm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-lgtm }
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.39.0
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /api/health, port: grafana }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 5Gi }
---
apiVersion: v1
kind: Service
metadata: { name: otel-gateway }
spec:
  selector: { app.kubernetes.io/name: otel-lgtm }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app.kubernetes.io/name: otel-lgtm }
  ports:
    - { name: http, port: 80, targetPort: grafana }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  annotations:
    cert-manager.io/cluster-issuer: store-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [grafana.store.local]
      secretName: grafana-tls
  rules:
    - host: grafana.store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: grafana, port: { name: http } } }
---
# Carga los dashboards (ConfigMaps con label grafana_dashboard) por la API de Grafana.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-dashboards-loader
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: load
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -e; for f in /dashboards/*.json; do
              printf '{"overwrite":true,"folderUid":"","dashboard":%s}' "$(cat "$f")" > /tmp/payload.json;
              curl -fsS -u admin:admin -H 'Content-Type: application/json' -X POST
              http://grafana.observability.svc.cluster.local/api/dashboards/db --data @/tmp/payload.json; echo; done
          volumeMounts:
            - { name: dashboards, mountPath: /dashboards }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: dashboards
          configMap: { name: store-dashboards }
        - name: tmp
          emptyDir: {}
