apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 30m
  releaseName: keda
  targetNamespace: keda
  storageNamespace: keda
  install:
    createNamespace: true
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3, remediateLastFailure: true }
  chart:
    spec:
      chart: keda
      version: "2.21.1"
      sourceRef: { kind: HelmRepository, name: kedacore, namespace: flux-system }
