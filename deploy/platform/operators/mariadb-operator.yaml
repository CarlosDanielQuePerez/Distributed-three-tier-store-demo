apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: flux-system
spec:
  interval: 30m
  releaseName: mariadb-operator-crds
  targetNamespace: mariadb-operator
  storageNamespace: mariadb-operator
  install:
    createNamespace: true
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3, remediateLastFailure: true }
  chart:
    spec:
      chart: mariadb-operator-crds
      version: "26.10.2"
      sourceRef: { kind: HelmRepository, name: mariadb-operator, namespace: flux-system }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: mariadb-operator
  targetNamespace: mariadb-operator
  storageNamespace: mariadb-operator
  install:
    createNamespace: true
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3, remediateLastFailure: true }
  chart:
    spec:
      chart: mariadb-operator
      version: "26.10.2"
      sourceRef: { kind: HelmRepository, name: mariadb-operator, namespace: flux-system }
  dependsOn:
    - name: mariadb-operator-crds
  values:
    # Sin ServiceMonitor (no instalamos prometheus-operator); las métricas salen por OTel.
    metrics: { enabled: false }
