apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: redis-operator
  targetNamespace: redis-operator
  storageNamespace: redis-operator
  install:
    createNamespace: true
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3, remediateLastFailure: true }
  chart:
    spec:
      chart: redis-operator
      version: "0.27.0"
      sourceRef: { kind: HelmRepository, name: ot-container-kit, namespace: flux-system }
