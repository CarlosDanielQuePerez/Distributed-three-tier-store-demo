apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 30m
  releaseName: kyverno
  targetNamespace: kyverno
  storageNamespace: kyverno
  install:
    createNamespace: true
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3, remediateLastFailure: true }
  chart:
    spec:
      chart: kyverno
      version: "3.3.9"
      sourceRef: { kind: HelmRepository, name: kyverno, namespace: flux-system }
  values:
    admissionController: { replicas: 1 }
    backgroundController: { replicas: 1 }
    cleanupController: { replicas: 1 }
    reportsController: { replicas: 1 }
