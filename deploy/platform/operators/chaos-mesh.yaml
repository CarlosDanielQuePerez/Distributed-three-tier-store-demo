apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: flux-system
spec:
  interval: 30m
  releaseName: chaos-mesh
  targetNamespace: chaos-mesh
  storageNamespace: chaos-mesh
  install:
    createNamespace: true
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3, remediateLastFailure: true }
  chart:
    spec:
      chart: chaos-mesh
      version: "2.8.8"
      sourceRef: { kind: HelmRepository, name: chaos-mesh, namespace: flux-system }
  values:
    # Runtime de K3s (containerd embebido).
    chaosDaemon:
      runtime: containerd
      socketPath: /run/k3s/containerd/containerd.sock
    dashboard: { securityMode: true }
