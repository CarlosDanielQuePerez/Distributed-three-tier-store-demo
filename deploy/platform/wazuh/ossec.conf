<!--
  Configuración del agente Wazuh para nodos K3s. El sistema de archivos del nodo está
  montado en /host (solo lectura). CHANGE_MANAGER_IP lo reemplaza el entrypoint con
  WAZUH_MANAGER_SERVER.
-->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>k3s</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- File Integrity Monitoring: configuración del nodo, binarios y manifiestos de K3s -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes" report_changes="yes">/host/etc/rancher</directories>
    <directories check_all="yes" realtime="yes">/host/var/lib/rancher/k3s/server/manifests</directories>
    <directories check_all="yes" realtime="yes">/host/var/lib/rancher/k3s/server/tls</directories>
    <directories check_all="yes">/host/etc/passwd,/host/etc/shadow,/host/etc/group,/host/etc/sudoers</directories>
    <directories check_all="yes">/host/etc/ssh</directories>
    <directories check_all="yes">/host/usr/local/bin</directories>
    <directories check_all="yes">/host/usr/bin,/host/usr/sbin</directories>
    <ignore>/host/var/lib/rancher/k3s/server/tls/temporary-certs</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
    <skip_nfs>yes</skip_nfs>
  </syscheck>

  <!-- Rootcheck: rootkits y configuraciones inseguras del host -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <base_directory>/host</base_directory>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- Inventario del sistema (paquetes del host) para detección de vulnerabilidades en el manager -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- Evaluación de configuración (CIS) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <!-- Logs de auditoría de la API de Kubernetes (los escribe K3s; ver infra/terraform) -->
  <localfile>
    <log_format>json</log_format>
    <location>/host/var/lib/rancher/k3s/server/logs/audit.log</location>
    <label key="@source">k3s-audit</label>
  </localfile>

  <!-- Logs del sistema del nodo -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/host/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/host/var/log/syslog</location>
  </localfile>

  <!-- Logs de los contenedores de la tienda (formato CRI) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/host/var/log/pods/store_*/*/*.log</location>
  </localfile>

  <!-- Active response conservador: solo se habilita en el manager tras afinar reglas -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>
</ossec_config>
