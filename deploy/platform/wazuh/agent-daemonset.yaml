apiVersion: v1
kind: ServiceAccount
metadata: { name: wazuh-agent }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  labels: { app.kubernetes.io/name: wazuh-agent }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: wazuh-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wazuh-agent }
    spec:
      serviceAccountName: wazuh-agent
      hostPID: true
      hostNetwork: false
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: wazuh/wazuh-agent:4.14.10
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: WAZUH_AGENT_NAME
              value: k3s-$(NODE_NAME)
            - name: WAZUH_AGENT_GROUP
              value: k3s-nodes
            # Servicios creados por wazuh-kubernetes: "wazuh-workers" (eventos, 1514)
            # y "wazuh" (registro, 1515).
            - name: WAZUH_MANAGER_SERVER
              value: wazuh-workers.wazuh.svc.cluster.local
            - name: WAZUH_REGISTRATION_SERVER
              value: wazuh.wazuh.svc.cluster.local
            - name: WAZUH_REGISTRATION_PASSWORD
              valueFrom: { secretKeyRef: { name: wazuh-authd-pass, key: authd.pass, optional: true } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            privileged: true
          volumeMounts:
            - { name: config, mountPath: /wazuh-config-mount/etc/ossec.conf, subPath: ossec.conf }
            - { name: host, mountPath: /host, readOnly: true, mountPropagation: HostToContainer }
      volumes:
        - name: config
          configMap: { name: wazuh-agent-conf }
        - name: host
          hostPath: { path: / }
