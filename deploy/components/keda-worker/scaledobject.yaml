apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-management
spec:
  secretTargetRef:
    - parameter: host
      name: store-app-secrets
      key: RABBITMQ_MANAGEMENT_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: store-worker
spec:
  scaleTargetRef:
    name: store-worker
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: reviews.created
        mode: QueueLength
        value: "50"
      authenticationRef:
        name: rabbitmq-management
