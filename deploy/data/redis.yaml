# Redis 1 primario + 2 réplicas con 3 Sentinels (OT redis-operator), con contraseña.
# Redis es una caché desechable: si se pierde, la API la repuebla desde MariaDB.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: store-redis
spec:
  clusterSize: 3
  podSecurityContext: { runAsUser: 1000, fsGroup: 1000 }
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.2.16
    imagePullPolicy: IfNotPresent
    redisSecret: { name: redis-credentials, key: password }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 512Mi } }
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: { app: store-redis }
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  # El operador agrega "-sentinel": StatefulSet/Service store-redis-sentinel-sentinel
  name: store-redis-sentinel
spec:
  clusterSize: 3
  podSecurityContext: { runAsUser: 1000, fsGroup: 1000 }
  pdb: { enabled: true, minAvailable: 2 }
  redisSentinelConfig:
    redisReplicationName: store-redis
    masterGroupName: mymaster
    redisReplicationPassword:
      secretKeyRef: { name: redis-credentials, key: password }
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.2.16
    imagePullPolicy: IfNotPresent
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
