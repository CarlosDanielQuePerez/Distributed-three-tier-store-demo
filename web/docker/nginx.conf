# nginx.conf principal de la imagen store-web (Kubernetes). Corre sin root en el
# puerto 8080 y con el sistema de archivos raíz de solo lectura (temporales en /tmp).
load_module modules/ngx_otel_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Logs JSON con trace_id para correlacionar en Loki ↔ Tempo.
    log_format json escape=json '{"time":"$time_iso8601","service":"store-web","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"duration":$request_time,'
        '"upstream_duration":"$upstream_response_time","trace_id":"$otel_trace_id","pod":"$hostname"}';
    access_log /dev/stdout json;

    include /etc/nginx/conf.d/*.conf;
}
