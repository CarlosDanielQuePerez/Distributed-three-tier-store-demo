# Configuración de Nginx para Docker Compose (desarrollo local).
# La imagen de Kubernetes usa web/docker/*.conf (con ngx_otel_module).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /catalog.js {
        alias /usr/share/nginx/catalog.js;
    }

    location = /catalog.css {
        alias /usr/share/nginx/catalog.css;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # En Compose Grafana (otel-lgtm) se publica en el puerto 3000 del host.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.STORE_CONFIG = { grafanaUrl: "http://localhost:3000", browserTracing: true };\n';
    }

    # Spans del navegador → OTel Collector de otel-lgtm (perfil "observability").
    location = /otel/v1/traces {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s;
        set $otel_collector http://otel-lgtm:4318;
        proxy_pass $otel_collector/v1/traces;
    }

    location /api/ {
        proxy_pass http://172.31.0.250:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Presentation-LB $http_x_presentation_lb;
        proxy_set_header X-Web-Node $hostname;
        # Contexto W3C del navegador hacia la API (la API continúa la traza).
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
