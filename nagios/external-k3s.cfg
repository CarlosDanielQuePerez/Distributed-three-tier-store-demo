# Nagios como monitor EXTERNO de caja negra para el clúster K3s (Fase 6).
# Corre fuera del clúster (nagios/docker-compose.external.yml). Solo verifica lo que ve
# un usuario: HTTP de la tienda por el Ingress, vencimiento del certificado TLS y que la
# API de Kubernetes de cada nodo responda. Las métricas internas son de Grafana/Mimir.
# Los nombres k3s-node1..3 y store-ingress los resuelve extra_hosts del compose.

define command {
    command_name check_store_http
    command_line $USER1$/check_http -H $ARG1$ -I $HOSTADDRESS$ -p 80 -u $ARG2$ -e 200 -w 1 -c 3
}

define command {
    command_name check_store_https_cert
    command_line $USER1$/check_http -H $ARG1$ -I $HOSTADDRESS$ -S --sni -p 443 -C 21,7
}

define command {
    command_name check_store_https
    command_line $USER1$/check_http -H $ARG1$ -I $HOSTADDRESS$ -S --sni -p 443 -u $ARG2$ -e 200 -w 1 -c 3
}

define command {
    command_name check_k8s_api
    command_line $USER1$/check_http -I $HOSTADDRESS$ -S -p 6443 -u /readyz -e 200 -s ok
}

define hostgroup {
    hostgroup_name  k3s-nodes
    alias           Nodos K3s
}

define host {
    use                 generic-host
    host_name           store-ingress
    alias               VIP de MetalLB / Traefik
    address             store-ingress
    check_command       check_store_http!store.local!/healthz
    max_check_attempts  3
}

define service {
    use                 generic-service
    host_name           store-ingress
    service_description Tienda HTTP (/)
    check_command       check_store_http!store.local!/
}

define service {
    use                 generic-service
    host_name           store-ingress
    service_description API readyz por Ingress
    check_command       check_store_http!store.local!/api/readyz
}

define service {
    use                 generic-service
    host_name           store-ingress
    service_description Catálogo por Ingress
    check_command       check_store_https!store.local!/api/products/cheapest
}

define service {
    use                 generic-service
    host_name           store-ingress
    service_description Certificado TLS (vence en <21 días: warning, <7: critical)
    check_command       check_store_https_cert!store.local
    check_interval      60
}

define host {
    use                 generic-host
    host_name           k3s-node1
    address             k3s-node1
    hostgroups          k3s-nodes
    check_command       check-host-alive
}

define host {
    use                 generic-host
    host_name           k3s-node2
    address             k3s-node2
    hostgroups          k3s-nodes
    check_command       check-host-alive
}

define host {
    use                 generic-host
    host_name           k3s-node3
    address             k3s-node3
    hostgroups          k3s-nodes
    check_command       check-host-alive
}

define service {
    use                 generic-service
    hostgroup_name      k3s-nodes
    service_description Kubernetes API /readyz
    check_command       check_k8s_api
}
